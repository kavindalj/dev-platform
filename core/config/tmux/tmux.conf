# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

#switch panes using hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse mode
set -g mouse on

# Set default terminal color
set -g default-terminal "screen-256color"

# Status bar
set -g status-bg black
set -g status-fg gray

# Inactive windows
set -g window-status-style fg=gray,bg=black
set -g window-status-format " #I:#W "

# Active window
set -g window-status-current-style fg=black,bg=white,bold
set -g window-status-current-format " #I:#W "

# Set status bar position
set-option -g status-position top

# Remove left-side session display
set -g status-left ""

# Show session name if custom, otherwise current directory
set -g status-right '#{?#{m/r:^[0-9]+$,#S},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#S} | %Y-%m-%d %H:%M'

# reload config file
bind r source-file ~/.tmux.conf
